name: Django CI Tests

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build:

    runs-on: macos_latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ['3.13']

    services:
        db:
            image: postgres:17
            env:
                POSTGRES_DB: when2meet
                POSTGRES_USER: admin
                POSTGRES_PASSWORD: orbital2425
            ports:
                - 5432:5432
            options: >-
                --health-cmd = "pg_isready"
                --health-interval = 10s
                --health-timeout = 5s
                --health-retires = 5

    env:
        DB_NAME: when2meet
        DB_USER: admin
        DB_PASSWORD: orbital2425
        DB_HOST: 127.0.0.1
        DB_PORT: 5432
        DJANGO_SECRET_KEY: ${{ secrets.SECRET_KEY }}
        GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET}}
        GOOGLE_MAPS_API_KEYL: ${{ secrets.GOOGLE_MAPS_API_KEY }}

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        cd "Django Code Base"
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Apply Migrations
      run: |
        cd "Django Code Base"
        python manage.py makemigrations
        python manage.py migrate

    - name: Run Tests
      run: |
        python manage.py test
